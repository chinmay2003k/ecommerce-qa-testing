
<!DOCTYPE html>
<html>
<head>
    <title>Shopping Cart - QA Shop</title>
</head>
<body>

    <h1>Shopping Cart</h1>

    {% if cart_items %}

        {% for item in cart_items %}
            <div>
                <h3>{{ item.name }}</h3>
                <p>Price: ₹{{ item.price }}</p>
            </div>
            <hr>
        {% endfor %}

        <h2>Total: ₹{{ total }}</h2>

        <a href="/checkout">
            <button>Proceed to Checkout</button>
        </a>

    {% else %}

        <p>Your cart is empty.</p>

    {% endif %}

    <br><br>

    <a href="/products">
        <button>Continue Shopping</button>
    </a>

</body>
</html>
